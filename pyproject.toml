[tool.poetry]
name = "library-registry-submission-parser"
version = "0.0.0"
description = "Arduino Library Manager submission parser"
authors = ["Arduino <info@arduino.cc>"]

[tool.poetry.dependencies]
python = "~3.15.2"

[tool.poetry.dev-dependencies]
black = "^26.10"
flake8 = "^7.3.0"
pep8-naming = "^0.15.1"
codespell = "^2.4.3"
pytest = "9.2.0"
invoke = "3.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py39"]
